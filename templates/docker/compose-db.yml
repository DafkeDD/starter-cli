    db:
        image: postgres:17-alpine
        restart: unless-stopped
        environment:
            POSTGRES_USER: ${DB_USER}
            POSTGRES_PASSWORD: ${DB_PASSWORD}
            POSTGRES_DB: ${DB_NAME}
            # Gelezen door het script hieronder, dat de tweede database maakt.
            OIDC_DB_NAME: ${OIDC_DB_NAME}
        ports:
            - "${DB_PORT}:5432"
        volumes:
            - db-data:/var/lib/postgresql/data
            # Het postgres-image maakt maar een database aan. Dit script maakt
            # er bij de eerste start een tweede bij voor de OIDC-hub. Het draait
            # alleen als het volume nog leeg is - bestaat de database al, dan
            # gebeurt er niets.
            - ./docker/init-oidc-db.sh:/docker-entrypoint-initdb.d/10-oidc-db.sh:ro
        healthcheck:
            # Zonder healthcheck staat de poort al open voor de database klaar
            # is, en dan faalt je eerste migratie zonder duidelijke reden.
            test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
            interval: 5s
            timeout: 5s
            retries: 10

